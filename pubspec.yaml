name: luma
description: Reproductor de música de YouTube (IFrame oficial + Data API).
publish_to: "none"
version: 0.2.0+9

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.2
  youtube_player_iframe: ^5.2.1
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
